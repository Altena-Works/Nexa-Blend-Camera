[workspace]
members = ["crates/nexa-blend-camera", "crates/nexa-mmd-camera-plugin"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A standalone Blender camera importer for MikuMikuDance"
publish = false
license = "Apache-2.0"

[profile.dev]
opt-level = 0
debug = 2
lto = false
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release]
opt-level = 2
debug = 1
lto = false
codegen-units = 1
panic = "abort"
overflow-checks = true
